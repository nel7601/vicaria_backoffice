<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Vicaria app icon — the brand's leaf embrace, reimagined as the executive
    secretary: berry figure with a chignon and a headset, cradled by the green
    leaf sweep of the original mark, small leaf at the top right.
  -->
  <defs>
    <linearGradient id="berry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C7367C"/>
      <stop offset="1" stop-color="#DD7FB0"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <rect width="512" height="512" rx="110" fill="#FDFBF7"/>

  <!-- small top-right leaf, from the original mark -->
  <path d="M366 132
           C 386 76, 442 52, 478 58
           C 480 108, 448 152, 400 158
           C 384 160, 372 150, 366 132 Z"
        fill="#5E8F3C"/>
  <path d="M382 138 C 410 114, 438 92, 462 74"
        fill="none" stroke="#FDFBF7" stroke-width="10" stroke-linecap="round"/>

  <!-- green leaf sweep cradling the figure, one pointed tip on the right -->
  <path d="M88 236
           C 60 330, 106 420, 200 452
           C 300 486, 402 442, 442 348
           C 456 314, 460 260, 446 188
           C 440 262, 408 330, 336 370
           C 264 410, 164 394, 120 332
           C 98 302, 86 268, 88 236 Z"
        fill="#5E8F3C"/>

  <!-- secretary: bust in berry -->
  <!-- shoulders / blazer -->
  <path d="M148 396
           C 150 330, 200 292, 256 292
           C 312 292, 362 330, 364 396
           C 364 408, 356 414, 344 414
           L 168 414
           C 156 414, 148 408, 148 396 Z"
        fill="url(#berry)"/>
  <!-- V-neck -->
  <path d="M256 294 L 232 294 L 256 344 L 280 294 Z" fill="#FDFBF7"/>
  <!-- neck -->
  <rect x="238" y="248" width="36" height="44" rx="14" fill="url(#berry)"/>
  <!-- chignon bun (behind the band) -->
  <circle cx="316" cy="142" r="24" fill="#C7367C"/>
  <!-- head -->
  <circle cx="256" cy="198" r="62" fill="url(#berry)"/>
  <!-- headset band hugging the crown -->
  <path d="M198 186 C 202 148, 226 130, 256 128 C 286 130, 310 148, 314 186"
        fill="none" stroke="#3F6B27" stroke-width="15" stroke-linecap="round"/>
  <!-- earpiece on the left ear -->
  <rect x="184" y="176" width="22" height="42" rx="11" fill="#3F6B27"/>
  <!-- mic boom to the mouth, tip left of the chin -->
  <path d="M198 216 C 200 244, 214 262, 236 268"
        fill="none" stroke="#3F6B27" stroke-width="11" stroke-linecap="round"/>
  <circle cx="242" cy="269" r="10" fill="#3F6B27"/>
</svg>
